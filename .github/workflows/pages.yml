name: Publish VAD neural workbench
on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'src/**'
      - 'tests/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify browser inference and exported neural weights
        run: node --test tests/*.test.mjs
      - name: Check Python syntax and lightweight tests
        run: |
          python -m compileall -q src
          python -m unittest discover -s tests -p 'test_*.py' -v
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
